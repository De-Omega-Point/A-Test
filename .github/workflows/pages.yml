name: Validate and deploy A-Test
on:
  push:
    branches: ["main", "dev/aus-test-v3-deep-learning"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check arcade.js
          node --check storage.js
          node --check study-ui.js
          node --check tests/arcade-contract.cjs
          node --check tests/study-contract.cjs
          node --check v3-content.js
          node --check v3-intelligence.js
          node --check lesson-resources.js
          node --check booklet-reader.js
          node --check tests/v3-exam-contract.cjs
          node --check tests/v3-content-contract.cjs
          node --check tests/official-content-contract.cjs
      - name: Required files
        run: test -s index.html && test -s styles.css && test -s app.js && test -s arcade.css && test -s arcade.js && test -s storage.js && test -s study-ui.js && test -s study-ui.css && test -s v3-content.js && test -s v3-intelligence.js && test -s tests/v3-exam-contract.cjs && test -s tests/v3-content-contract.cjs && test -s lesson-resources.js && test -s booklet-reader.js && test -s assets/our-common-bond-testable.pdf
      - name: Local booklet PDF integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/our-common-bond-testable.pdf')
          b=p.read_bytes()
          assert b.startswith(b'%PDF-') and b'%%EOF' in b[-4096:], 'Invalid PDF'
          assert 10_000_000 < len(b) < 25_000_000, 'Unexpected PDF size'
          print('Local official booklet verified:',len(b),'bytes')
          PY
      - name: Product contract
        run: |
          grep -q 'data-view="home"' index.html
          grep -q 'data-view="study"' index.html
          grep -q 'data-view="practice"' index.html
          grep -q 'data-view="games"' index.html
          grep -q 'data-view="mock"' index.html
          grep -q 'data-view="readiness"' index.html
          grep -q 'function dashboard' app.js
          grep -q 'function mock' app.js
          grep -q 'function curriculumAudit' app.js
          grep -q 'function studyResume' app.js
          grep -q 'function adaptiveEvidence' app.js
          grep -q 'function finishMock' app.js
          grep -q 'function games' app.js
          grep -q 'const domainKnowledge=' app.js
          grep -q 'const domainEnrichment=' app.js
          grep -q 'const domainQuestionBank=' app.js
      - name: Arcade regression checks
        run: node tests/arcade-contract.cjs
      - name: Study regression checks
        run: node tests/study-contract.cjs
      - name: V3 deep-learning regression checks
        run: |
          node tests/v3-content-contract.cjs
          node tests/v3-exam-contract.cjs
          node tests/official-content-contract.cjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test the served application in Chromium
        run: python tests/browser-smoke.py
      - name: Install automated accessibility audit
        if: github.event_name == 'pull_request'
        run: npm install --no-save --ignore-scripts axe-core@4.10.3
      - name: Check public release and assistive-tech semantics
        if: github.event_name == 'pull_request'
        run: python tests/live-release-accessibility.py
      - name: Validation summary
        if: always()
        run: |
          echo '### AUS-TEST V3 checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Branch: ${{ github.ref_name }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production deployment is restricted to main.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live application and local booklet
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')
          def fetch(path):
              req=urllib.request.Request(base+'/'+path,headers={'User-Agent':'AUS-TEST release-check'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  if path.endswith('.pdf'):
                      return response.read(8)
                  return response.read(250_000)
          for attempt in range(12):
              try:
                  marker=json.loads(fetch('release-status.json'))
                  assert marker.get('syllabusTopics')==42, marker
                  html=fetch('index.html').decode('utf-8')
                  assert 'booklet-reader.js' in html and 'study-ui.js' in html
                  reader=fetch('booklet-reader.js').decode('utf-8')
                  assert '/A-Test/assets/our-common-bond-testable.pdf' in reader
                  assert fetch('assets/our-common-bond-testable.pdf').startswith(b'%PDF-'), 'Published booklet is not a PDF'
                  print('LIVE RELEASE VERIFIED',base,'PDF + reader + syllabus entry')
                  break
              except Exception as error:
                  print('Attempt',attempt+1,'not ready:',error,flush=True)
                  if attempt==11: raise
                  time.sleep(10)
          PY
