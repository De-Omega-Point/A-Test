name: Validate and deploy A-Test
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Required files
        run: test -s index.html && test -s styles.css && test -s app.js
      - name: Product contract
        run: |
          grep -q 'data-view="home"' index.html
          grep -q 'data-view="study"' index.html
          grep -q 'data-view="practice"' index.html
          grep -q 'data-view="games"' index.html
          grep -q 'data-view="mock"' index.html
          grep -q 'data-view="readiness"' index.html
          grep -q 'function dashboard' app.js
          grep -q 'function mock' app.js
          grep -q 'function curriculumAudit' app.js\n          grep -q 'function studyResume' app.js\n          grep -q 'function adaptiveEvidence' app.js\n          grep -q 'function finishMock' app.js\n          grep -q 'function games' app.js
          grep -q 'const domainKnowledge=' app.js
          grep -q 'const domainEnrichment=' app.js
          grep -q 'const domainQuestionBank=' app.js
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
